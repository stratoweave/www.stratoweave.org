on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Set vars for build only if not on main"
        run: |
          echo "PAGES_BRANCH=test-pages" >> $GITHUB_ENV
        if: github.ref != 'refs/heads/main'
      - name: "Set vars for deploy if on main"
        run: |
          echo "PAGES_BRANCH=gh-pages" >> $GITHUB_ENV
        if: github.ref == 'refs/heads/main'
      - name: 'Checkout'
        uses: actions/checkout@master
      - name: "Set repo-specific site vars"
        run: |
          echo "SITE_BASE_URL=https://www.stratoweave.org" >> $GITHUB_ENV
          echo "SITE_DOMAIN=www.stratoweave.org" >> $GITHUB_ENV
      - name: "Set deploy CNAME"
        run: |
          if [ -z "$SITE_DOMAIN" ]; then
            echo "SITE_DOMAIN is empty; refusing to deploy without CNAME"
            exit 1
          fi
          printf '%s\n' "$SITE_DOMAIN" > static/CNAME
        if: github.ref == 'refs/heads/main'
      # The interactive webui demo (served at /demo/webui/) is built fresh
      # from the sorespo repo on every deploy; static/demo/ is gitignored.
      # Pin `ref` to a tag/SHA if sorespo main ever needs decoupling.
      - name: 'Checkout sorespo (webui demo source)'
        uses: actions/checkout@v4
        with:
          repository: stratoweave/sorespo
          ref: main
          path: sorespo-src
      - name: 'Set up bun'
        uses: oven-sh/setup-bun@v2
      - name: 'Build webui demo into static/'
        run: SORESPO_DIR="$GITHUB_WORKSPACE/sorespo-src" ./scripts/update-webui-demo.sh
      - name: 'Build and deploy'
        uses: shalzz/zola-deploy-action@master
        env:
          BUILD_DIR: .
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BRANCH: ${{ env.PAGES_BRANCH }}
          BUILD_FLAGS: --base-url ${{ env.SITE_BASE_URL }}
