# The URL the site will be built for
base_url = "https://www.stratoweave.org"
title = "StratoWeave"
description = "Reactive network orchestration with YANG models, layered transforms, open interfaces, and streaming telemetry."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

[markdown]

[markdown.highlighting]
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
# Put all your custom variables here
juice_logo_name = "StratoWeave"
juice_logo_path = "stratoweave-icon.svg"

juice_extra_menu = [
    { title = "Tutorials", link = "/tutorials"},
    { title = "Articles", link = "/articles/"},
    { title = "Governance", link = "/governance"},
    { title = "Github", link = "https://github.com/stratoweave/stratoweave"}
]
repository_url = "https://github.com/stratoweave/stratoweave"

# Dates are optional ISO 8601 timestamps. Use a new unique id for each announcement
# so visitors who dismissed an older message will still see the new one.
[[extra.announcements]]
id = "stratoweave-one-summit-dec-2026"
start_at = ""
end_at = "2026-12-10T15:40:00+09:00"
text = "Learn about closed-loop automation for transport networks with StratoWeave at ONE Summit 2026 on December 10 in Tokyo, Japan."
link = "https://onesummit2026.sched.com/event/2Z3i5/bringing-closed-loop-automation-to-transport-networks-an-introduction-to-stratoweave-ian-farrer-deutsche-telekom-ag"
