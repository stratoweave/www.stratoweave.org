{% component render_header() %}
<a class="site-logo" href="{{ get_url(path="/") }}">
    <span class="brand-mark" aria-hidden="true">
        <img src="{{ get_url(path="stratoweave-logo.svg") }}" alt="">
    </span>
</a>

<!-- Keep navigation and its SVG icons out of Safari Reader's extracted content. -->
<div class="site-nav-shell instapaper_ignore">
    <button
        class="site-nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav-primary"
        aria-label="Toggle navigation menu"
    >
        <span class="site-nav-toggle__bars" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
        </span>
    </button>

    <nav id="site-nav-primary" class="site-nav instapaper_ignore" aria-label="Primary navigation">
        <a class="nav-item" href="{{ get_url(path="/tutorials") }}">Get Started</a>
        <a class="nav-item" href="{{ get_url(path="/articles/") }}">Articles</a>
        <a class="nav-item" href="https://stratoweave.guide" target="_blank" rel="noopener noreferrer">Documentation</a>
        <div class="nav-group">
            <a class="nav-item nav-item--group" href="{{ get_url(path="/community") }}">Community</a>
            <button class="nav-group-toggle" type="button" aria-label="Toggle Community submenu" aria-expanded="false" aria-controls="community-menu"></button>
            <div class="nav-subnav" id="community-menu">
                <ul class="nav-subnav__items">
                    <li><a class="nav-item--subnav" href="{{ get_url(path="/governance") }}">Governance</a></li>
                </ul>
            </div>
        </div>
        <a class="nav-item" href="{{ get_url(path="/partners") }}">Partners</a>
        <a
            class="nav-item nav-item--icon"
            href="https://github.com/stratoweave"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="StratoWeave on GitHub"
            title="StratoWeave on GitHub"
        >
            <svg class="nav-icon" viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
                <path
                    fill="currentColor"
                    d="M12 0C5.372 0 0 5.373 0 12c0 5.302 3.438 9.8 8.206 11.387.6.11.82-.26.82-.577v-2.235c-3.338.726-4.042-1.415-4.042-1.415-.546-1.388-1.333-1.758-1.333-1.758-1.09-.745.083-.729.083-.729 1.205.085 1.84 1.238 1.84 1.238 1.07 1.835 2.809 1.304 3.495.997.108-.775.418-1.304.762-1.603-2.665-.303-5.467-1.333-5.467-5.93 0-1.31.468-2.382 1.237-3.222-.124-.303-.536-1.524.117-3.176 0 0 1.008-.323 3.302 1.23A11.52 11.52 0 0 1 12 5.818c1.02.005 2.047.138 3.006.404 2.292-1.554 3.298-1.231 3.298-1.231.656 1.653.244 2.874.12 3.177.771.84 1.236 1.912 1.236 3.222 0 4.609-2.807 5.624-5.48 5.921.43.371.823 1.102.823 2.221v3.292c0 .319.216.694.825.576C20.565 21.798 24 17.302 24 12c0-6.627-5.373-12-12-12z"
                />
            </svg>
        </a>
    </nav>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".site-nav-shell").forEach(function (shell) {
        const toggle = shell.querySelector(".site-nav-toggle");
        const nav = shell.querySelector(".site-nav");

        if (!toggle || !nav) {
            return;
        }

        const mobileQuery = window.matchMedia("(max-width: 700px)");

        const groups = Array.from(nav.querySelectorAll(".nav-group"));

        function setGroupOpen(group, open) {
            group.classList.toggle("nav-group--open", open);
            group.querySelector("button").setAttribute("aria-expanded", String(open));
        }

        groups.forEach(function (group) {
            const trigger = group.querySelector("button");
            const overview = group.querySelector(".nav-item--group");
            group.addEventListener("pointerenter", function (event) {
                if (event.pointerType === "mouse") setGroupOpen(group, true);
            });
            group.addEventListener("pointerleave", function (event) {
                if (event.pointerType === "mouse" && !group.contains(document.activeElement)) {
                    setGroupOpen(group, false);
                }
            });
            trigger.addEventListener("click", function () {
                const open = !group.classList.contains("nav-group--open");
                groups.forEach(function (other) { setGroupOpen(other, false); });
                setGroupOpen(group, open);
            });
            function enterSubmenu(event) {
                if (event.key === "ArrowDown") {
                    event.preventDefault();
                    setGroupOpen(group, true);
                    group.querySelector(".nav-subnav a").focus();
                }
            }
            trigger.addEventListener("keydown", enterSubmenu);
            overview.addEventListener("keydown", enterSubmenu);
            group.addEventListener("focusout", function (event) {
                if (!group.contains(event.relatedTarget)) setGroupOpen(group, false);
            });
        });

        function closeMenu() {
            groups.forEach(function (group) { setGroupOpen(group, false); });
            shell.classList.remove("site-nav-shell--open");
            toggle.setAttribute("aria-expanded", "false");
        }

        function syncMenuState() {
            shell.classList.add("site-nav-shell--ready");

            closeMenu();
        }

        toggle.addEventListener("click", function () {
            const isOpen = shell.classList.toggle("site-nav-shell--open");
            toggle.setAttribute("aria-expanded", String(isOpen));
            if (!isOpen) closeMenu();
        });

        nav.querySelectorAll("a").forEach(function (link) {
            link.addEventListener("click", closeMenu);
        });

        document.addEventListener("click", function (event) {
            if (shell.contains(event.target)) {
                return;
            }

            closeMenu();
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape") {
                const openGroup = groups.find(function (group) {
                    return group.classList.contains("nav-group--open");
                });
                if (openGroup) {
                    setGroupOpen(openGroup, false);
                    openGroup.querySelector("button").focus();
                } else {
                    if (shell.classList.contains("site-nav-shell--open")) toggle.focus();
                    closeMenu();
                }
            }
        });

        if (typeof mobileQuery.addEventListener === "function") {
            mobileQuery.addEventListener("change", syncMenuState);
        } else {
            mobileQuery.addListener(syncMenuState);
        }

        syncMenuState();
    });
});
</script>
{% endcomponent render_header %}
